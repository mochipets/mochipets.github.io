<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi Pets</title>
<meta name="description" content="Mochi Pets : un petit animal te tient compagnie pendant que tu étudies ou travailles.">
<style>
  :root {
    --bg: #FBF5EC;
    --card: #FFFFFF;
    --ink: #4A3A40;
    --ink-2: #7D6B72;
    --accent: #D9677F;
    --on-accent: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2A2230;
      --card: #352B3C;
      --ink: #F3E9EE;
      --ink-2: #C3B2BC;
      --accent: #F29BB0;
      --on-accent: #2A2230;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Maru Gothic ProN", "PingFang TC", "Noto Sans TC", sans-serif;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 480px; padding: 48px 16px; text-align: center; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { color: var(--ink-2); margin: 0 0 28px; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  a {
    display: block;
    padding: 14px 18px;
    border-radius: 18px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
  }
  a:hover { color: var(--accent); }
  a.store { background: var(--accent); color: var(--on-accent); }
  a.store:hover { color: var(--on-accent); opacity: 0.9; }
  a.lang {
    display: inline-block;
    padding: 4px 8px;
    background: none;
    color: var(--ink-2);
    font-size: 14px;
    font-weight: 400;
  }
  .langs { margin-top: 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 2px; }
</style>
</head>
<body>
<main>
  <h1>Mochi Pets</h1>
  <p>Un petit animal te tient compagnie pendant que tu étudies ou travailles.</p>
  <nav>
    <a class="store" href="https://apps.apple.com/app/id6827751359">Télécharger dans l'App Store</a>
    <a href="support.html">Assistance et FAQ</a>
    <a href="privacy.html">Politique de confidentialité</a>
  </nav>
  <div class="langs">
    <a class="lang" href="../">繁體中文</a>
    <a class="lang" href="../en/">English</a>
    <a class="lang" href="../zh-hans/">简体中文</a>
    <a class="lang" href="../ja/">日本語</a>
    <a class="lang" href="../ko/">한국어</a>
    <a class="lang" href="../es/">Español</a>
    <a class="lang" href="../pt-br/">Português</a>
    <a class="lang" href="../de/">Deutsch</a>
  </div>
</main>
</body>
</html>
